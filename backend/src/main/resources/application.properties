server.port=8080

# Database Configuration (PostgreSQL / Supabase IPv4 Pooler - Port 5432 Session Mode)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.jmytujlsfgyacchqejyr}
spring.datasource.password=${DB_PASSWORD:vipulmilk@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool settings for cloud databases (like Supabase)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=45000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (Automatically creates all tables in Supabase on startup)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Initial Owner Configuration (Can be overridden by env vars)
app.owner.username=vipul
app.owner.default-password=vipul@dairy2026
app.owner.name=Vipul Dairy Owner

# PDF Storage Path
app.storage.pdf-dir=./data/bills/pdf

# Server Session / Cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=7d
